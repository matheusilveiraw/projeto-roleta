<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roleta de Palavras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Roleta de Palavras</h1>

    <div class="roleta">
      <div class="ponteiro"></div>
      <canvas id="canvas" width="500" height="500"></canvas>
    </div>

    <button id="girar" disabled>Girar</button>
    <p id="resultado"></p>
    <button id="classificar" class="secundario" hidden>Oxítona, paroxítona ou proparoxítona?</button>
    <p id="classificacao"></p>
    <p id="total" class="total"></p>
  </main>

  <script src="palavras.js"></script>
  <script src="tonica.js"></script>
  <script src="script.js"></script>
</body>
</html>
